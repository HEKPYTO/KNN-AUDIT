name: integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ERRPEDIA_DATASET: ${{ github.workspace }}/.data/errpedia
  QDRANT_URL: http://127.0.0.1:6333
  DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
  FAISS_PYTHON: python3

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      qdrant:
        image: qdrant/qdrant:v1.20-unprivileged@sha256:f60765106f26981dabc593d88fe4d0c8138893442c7c59d62257390891b65277
        ports:
          - 6333:6333
      pgvector:
        image: pgvector/pgvector:0.8.7-pg19@sha256:89879f41d564f67b0c1462a491d16fcbc6de39ac10db17e7a4bba2138a5e0ba5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: ./scripts/check-pins.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python3 -m pip install -r scripts/requirements-faiss.txt
      - name: Fetch pinned dataset
        run: |
          mkdir -p .data/errpedia
          git -C .data/errpedia init -q
          git -C .data/errpedia remote add origin https://github.com/dynos01/errpedia
          git -C .data/errpedia fetch --depth 1 -q origin ba9bfbb7649b34d0c7619e2cf10bf6acb9fd6d06
          git -C .data/errpedia checkout -q --detach FETCH_HEAD
      - run: cargo install --path crates/knn-audit --locked --root "$RUNNER_TEMP/knn-install"
      - run: ERRPEDIA_DATASET="$ERRPEDIA_DATASET" cargo test --workspace --locked
      # ci-audit.sh pins --repeat 10 for Qdrant and --repeat 3 for reference, pgvector and FAISS.
      - name: Audit real engines and publish scorecards
        run: KNN_AUDIT="$RUNNER_TEMP/knn-install/bin/knn-audit" DATASET="$ERRPEDIA_DATASET" FAISS_PYTHON="$FAISS_PYTHON" ./scripts/ci-audit.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scorecards
          path: results/scorecards
