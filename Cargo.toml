[workspace]
members = ["crates/knn-audit", "crates/knn-audit-adapters"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
knn-audit-adapters = { path = "crates/knn-audit-adapters" }
assert_cmd = "2.2.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.9", features = ["derive"] }
num-bigint = "0.5.1"
num-traits = "0.2.19"
tempfile = "3.27.0"
rayon = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
